# hashcards-web configuration
#
# Copy this file to hashcards.toml and edit to match your setup, then start
# the server with `hashcards-web --config hashcards.toml` (or just
# `hashcards-web`, which reads hashcards.toml from the current directory).

[server]
# host = "127.0.0.1"                  # Bind address (default: 127.0.0.1).
                                      # Set to "0.0.0.0" to listen on all
                                      # interfaces. WARNING: without an [oidc]
                                      # section hashcards has no authentication;
                                      # anyone who can reach the port can read
                                      # and edit your cards.
# port = 8000                         # Port number (default: 8000)
data_dir = "/var/lib/hashcards"       # Directory for the card trees, the review
                                      # databases. Created
                                      # at startup, but only if the parent is
                                      # writable: /var/lib is root-owned, so a
                                      # systemd unit wants `StateDirectory=hashcards`
                                      # (which creates it owned by User=), and
                                      # anything else wants a mkdir + chown. Running
                                      # as yourself? Use ~/.local/share/hashcards.

# session_timeout_minutes = 1440       # Evict drill sessions idle this long; 0 disables (default: 1440)

[defaults]
# answer_controls = "full"            # "full" or "binary" (default: full)
# bury_siblings = true                # Hide sibling cards in same session (default: true)
# jitter = 0.05                       # Random +/- fraction applied to review intervals (0.0 to 0.5, default: 0.05)
# desired_retention = 0.9             # Chance a card is still remembered when it comes back (0.7 to 0.99, default: 0.9)
# max_interval_days = 256             # Ceiling on a review interval (1 to 36500, default: 256)

# Optional: OIDC login. Adding this section gates every route except /auth/*
# behind a login, and then *requires* an `owner` on every [[deck]] entry
# below. Each user's collections are the folders in their own card tree, so
# a collection is visible to exactly its one owner; there is no sharing,
# signup flow or admin UI. Conversely, an `owner` declared without an [oidc]
# section is a config error, since nobody would ever be logged in to match it.

# [oidc]
# issuer_url = "https://cloud.example.com"
#                                     # The provider's issuer, exactly as its
#                                     # discovery document declares it -- not the
#                                     # path the document happens to be served
#                                     # from. For Nextcloud that is the bare base
#                                     # URL: it serves the document at
#                                     # /index.php/.well-known/openid-configuration
#                                     # and redirects the standard path there,
#                                     # which hashcards follows, but the issuer
#                                     # itself has no /index.php. Check with
#                                     # `curl {issuer_url}/.well-known/openid-configuration`
#                                     # and use the "issuer" field you get back.
# client_id = "..."
# client_secret = "..."
# external_url = "https://hashcards.example.com"
#                                     # The public URL a browser actually reaches
#                                     # the server through. Independent of
#                                     # host/port (set it to the address in front
#                                     # of your reverse proxy). The OIDC redirect
#                                     # URI is {external_url}/auth/callback --
#                                     # register exactly that with your provider.
# session_secret = "..."              # Signs the login session cookie. At least
#                                     # 32 bytes; generate once with
#                                     # `openssl rand -hex 32` and keep it stable
#                                     # -- rotating it logs out every user.
#                                     # Config load fails if it is shorter.
# scopes = ["openid", "email", "profile"]
#                                     # Default shown; only `openid` is
#                                     # required. `owner` is matched against the
#                                     # `email` claim, case-insensitively, taken
#                                     # from the ID token or, failing that, the
#                                     # UserInfo endpoint -- Nextcloud only
#                                     # sends it from the latter. A provider
#                                     # that sends no email at all identifies
#                                     # users by their `sub` claim instead, and
#                                     # `owner` must then be written as that
#                                     # subject. Check what you get with:
#                                     #   curl -H "Authorization: Bearer <token>" \
#                                     #     {issuer_url}/apps/oidc/userinfo

# Collections are not configured here. A collection is a top-level folder in
# your card tree -- {data_dir}/cards/{your-email-slug}-{hash} with [oidc], or
# {data_dir}/cards/default without it -- created through My Cards (/files) or
# by hand. Which tree the folder sits in is who owns it.

# Optional: decks assembled across collections, drilled together in one session.
# `members` are "{collection-slug}/{deck-name}" pairs. Decks created through the
# web interface are written back to this file.

# [[deck]]
# name = "Exam revision"
# members = ["japanese/Verbs", "medicine-anatomy/Bones"]
# owner = "me@example.com"            # Required when [oidc] is configured

# Optional: the MCP endpoint at /mcp, which lets an AI assistant read and write
# your cards, decks and collections. It is authenticated by a token you mint
# for yourself at /tokens, shown once when it is created; every token can
# write, so give one out as carefully as you would your own password.
#
# Nothing an assistant deletes is destroyed -- it goes to your trash, and only
# you can empty that, from the web interface.

# [mcp]
# enabled = true                      # The default. Turn it off and /mcp does
#                                     # not exist at all.
#
# allowed_hosts = ["cards.example.com"]
#                                     # The hostnames /mcp will answer to.
#                                     # hashcards always allows localhost, so a
#                                     # client on this machine needs nothing
#                                     # here -- but an instance served under a
#                                     # real name MUST list it, or every MCP
#                                     # request is refused with nothing in the
#                                     # log to explain it. The check is what
#                                     # stops a web page in a browser from
#                                     # driving a local MCP server by pointing
#                                     # its own hostname at 127.0.0.1.
