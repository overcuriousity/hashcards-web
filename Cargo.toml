[package]
name = "hashcards-web"
version = "0.4.11"
edition = "2024"
description = "A multi-user web server for plain text spaced repetition."
homepage = "https://github.com/overcuriousity/hashcards-web"
repository = "https://github.com/overcuriousity/hashcards-web"
license = "Apache-2.0"
categories = ["web-programming"]

[dependencies]
axum = "0.8.9"
axum-extra = { version = "0.10", features = ["cookie-signed", "cookie-key-expansion"] }
blake3 = "1.8.3"
chrono = "0.4.44"
clap = { version = "4.6.1", features = ["derive"] }
env_logger = "0.11.10"
getrandom = "0.3"
log = "0.4.29"
maud = "0.27.0"
openidconnect = "4"
parking_lot = "0.12"
percent-encoding = "2.3.2"
pulldown-cmark = "0.13.3"
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tempfile = "3.27.0"
time = { version = "0.3", default-features = false }
tokio = { version = "1.52.1", features = ["rt-multi-thread", "fs", "signal", "time"] }
toml = "1.1.0"
reqwest = { version = "0.13.2", default-features = false, features = ["default-tls", "charset"] }
walkdir = "2.5.0"

[dev-dependencies]
jsonwebtoken = { version = "10.3", default-features = false, features = ["rust_crypto"] }
portpicker = "0.1.1"
reqwest = { version = "0.13.2", features = ["form", "cookies"] }

[profile.release]
strip = "symbols"
lto = true
codegen-units = 1
panic = "abort"

[lints.clippy]
# Allow using `if a { if b { ... } }` instead of `if a && b { ... }`.
collapsible_if = "allow"
# Allow using `match` instead of `if let`.
single_match = "allow"
